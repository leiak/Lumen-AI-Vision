[project]
name = "visual-recognition-edge"
version = "0.1.0"
description = "Edge service for vehicle detection and keyframe extraction"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.9.0",
  "ultralytics>=8.2.0",
  "supervision>=0.20.0",
  "numpy>=1.26.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

